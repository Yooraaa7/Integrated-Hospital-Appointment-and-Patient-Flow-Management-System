<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Care | AMS Admin Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="login.css"
    >
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <img
                    src="logo.png"
                    alt="The Care Hospital Logo"
                >
            </div>

            <h1>Hospital Analytics System</h1>

            <p class="subtitle">
                Admin Login
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="adminID">
                        Admin ID
                    </label>

                    <input
                        type="text"
                        id="adminID"
                        name="adminID"
                        placeholder="Enter your Admin ID"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <p
                    id="loginError"
                    class="login-error"
                    role="alert"
                ></p>

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

            <p class="footer-text">
                © 2026 The Care Hospital<br>
            </p>
        </div>


    </div>

    <script src="ams.js"></script>
    <script src="ams-api.js"></script>
    <script src="login.js"></script>

</body>

</html>
