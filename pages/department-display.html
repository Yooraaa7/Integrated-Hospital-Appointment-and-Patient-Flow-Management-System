<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Care | Department Queue Display</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/display.css">
</head>

<body>

    <main class="department-screen">

        <header class="display-header">

            <img src="../assets/logo.png" alt="The Care Logo">

            <div>
                <h1>The Care</h1>
                <p>Cardiology Department</p>
            </div>

            <div class="display-time">
                10:42 AM
            </div>

        </header>


        <section class="department-content">

            <div class="now-serving">

                <p>NOW SERVING</p>

                <div class="serving-number">
                    CD008
                </div>

                <div class="counter-label">
                    Please proceed to
                    <strong>Counter 2</strong>
                </div>

            </div>


            <div class="next-section">

                <h2>UP NEXT</h2>

                <div class="next-list">

                    <div>CD009</div>
                    <div>CD010</div>
                    <div>CD011</div>
                    <div>CD012</div>

                </div>

            </div>

        </section>


        <footer class="display-footer">
            Please remain in the waiting area until your number is called.
        </footer>

    </main>

</body>

</html>
