<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Care | Department Queue Display</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/display.css"
    >
</head>

<body>

    <main class="department-screen">

        <header class="display-header">

            <img
                src="../assets/logo.png"
                alt="The Care Logo"
            >

            <div>

                <h1>The Care</h1>

                <p id="displayDepartment">
                    Department Queue Display
                </p>

            </div>

            <div
                id="displayTime"
                class="display-time"
            >
                --:--:--
            </div>

        </header>


        <p
            id="displayError"
            class="display-error"
        ></p>


        <section class="department-content">

            <div class="now-serving">

                <p>NOW SERVING</p>

                <div
                    id="servingNumber"
                    class="serving-number"
                >
                    —
                </div>

                <div
                    id="counterLabel"
                    class="counter-label"
                >
                    No queue is currently being served.
                </div>


                <div
                    id="activeCounterList"
                    class="active-counter-list"
                ></div>

            </div>


            <div class="next-section">

                <h2>UP NEXT</h2>

                <div
                    id="nextList"
                    class="next-list"
                ></div>

            </div>

        </section>


        <footer class="display-footer">
            Please remain in the waiting area until your number is called.
        </footer>

    </main>

    <script src="../js/qms.js"></script>
    <script src="../js/department-display.js"></script>

</body>

</html>
