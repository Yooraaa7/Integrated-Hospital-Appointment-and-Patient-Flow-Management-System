<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Doctor | The Care Hospital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body data-page="doctors" data-root="../">
    <div id="nav"></div>

    <section class="page-header">
        <div class="main-container">
            <h1 class="page-title">Find a Doctor</h1>
            <p class="page-description">Search our doctors by specialty or doctor name.</p>
        </div>
    </section>

    <main class="main-container">
        <section class="card card-pad">
            <div class="toolbar">
                <div class="field">
                    <label for="doctorSpecialty">Specialty</label>
                    <select id="doctorSpecialty" class="form-select">
                        <option value="">Any Specialties</option>
                    </select>
                </div>

                <div class="field">
                    <label for="doctorNameSearch">Doctor Name</label>
                    <input id="doctorNameSearch" class="form-control" placeholder="Enter doctor's name">
                </div>

                <button class="btn btn-primary" id="doctorSearchButton">
                    <i class="bi bi-search"></i>
                    Search
                </button>

                <button class="btn btn-outline" id="doctorShowAll">
                    Show All
                </button>
            </div>
        </section>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:28px">
            <h2 class="page-title">Our Doctors</h2>
            <span id="doctorCount" class="muted-text"></span>
        </div>

        <div id="doctorGrid" class="doctor-grid"></div>

        <div id="doctorNoResults" class="card empty hidden" style="margin-top:20px">
            No doctors found.
        </div>
    </main>

    <div id="foot"></div>
    <script src="../js/app.js"></script>
</body>
</html>
