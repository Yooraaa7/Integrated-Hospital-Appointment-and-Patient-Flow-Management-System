<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Care | Lobby Queue Display</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/display.css"
    >
</head>

<body>

    <main class="lobby-screen">

        <header class="display-header">

            <img
                src="../assets/logo.png"
                alt="The Care Logo"
            >

            <div>

                <h1>The Care</h1>

                <p>
                    General Queue Display
                </p>

            </div>

            <div
                id="displayTime"
                class="display-time"
            >
                --:--:--
            </div>

        </header>


        <section class="lobby-content">

            <div class="lobby-title">

                <h2>
                    Current Queue Status
                </h2>

                <p>
                    Please proceed when your queue number is called.
                </p>

            </div>


            <div
                id="departmentGrid"
                class="department-grid"
            ></div>

        </section>


        <footer class="display-footer">
            The Care • Queue Management System
        </footer>

    </main>

    <script src="../js/qms.js"></script>
    <script src="../js/lobby-display.js"></script>

</body>

</html>
