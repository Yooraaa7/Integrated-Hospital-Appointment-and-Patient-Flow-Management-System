<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Care | Queue Kiosk</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="../css/kiosk.css"
    >
</head>

<body>

    <main class="kiosk-page">

        <section class="kiosk-card">

            <div class="logo">
                <img
                    src="../assets/logo.png"
                    alt="The Care Hospital Logo"
                >
            </div>

            <div class="instruction-section">

                <h3>Welcome to The Care Hospital</h3>

                <p>
                    Please get your queue ticket
                    for your visit.
                </p>

            </div>

            <button
                type="button"
                id="getTicketButton"
                class="get-ticket-button"
            >
                <i class="bi bi-ticket-perforated"></i>
                Get Ticket
            </button>

            <p
                id="errorMessage"
                class="error-message"
            ></p>

            <p class="kiosk-footer">
                Please take your ticket and wait
                for your number to be called.
            </p>

        </section>

    </main>

    <script src="../js/qms.js"></script>
<script src="../js/qms-api.js"></script>
    <script src="../js/kiosk.js"></script>

</body>

</html>
