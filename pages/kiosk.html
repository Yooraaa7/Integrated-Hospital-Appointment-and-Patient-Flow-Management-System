<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Care | Walk-In Queue Kiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/kiosk.css">
</head>
<body>

    <main class="kiosk-card">
        <img src="../assets/logo.png" alt="The Care Hospital Logo" class="logo-img">

        <p class="system-name">Queue Management System</p>
        <h1>Walk-In Queue Kiosk</h1>

        <!-- Prototype only. Later this department name will be loaded from the URL/backend. -->
        <div class="department-name">Cardiology</div>

        <p class="instruction-text">
            Press the button below to receive your queue number for this department.
        </p>

        <a href="ticket.html?department=cardiology" class="get-number-button">
            Get Queue Number
        </a>

        <p class="kiosk-note">
            Walk-in patients only. Patients with booked appointments should check in from their appointment details on The Care website.
        </p>
    </main>

</body>
</html>
