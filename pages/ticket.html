<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Care | Queue Ticket</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    ></script>


    <link
        rel="stylesheet"
        href="../css/ticket.css"
    >

</head>


<body>

    <main class="ticket-page">

        <div class="ticket">


            <div class="ticket-logo">

                <img
                    src="../assets/logo.png"
                    alt="The Care Hospital Logo"
                >

            </div>


            <div class="ticket-header">

                <p class="ticket-label">
                    QUEUE TICKET
                </p>


                <h1 id="departmentName">
                    Loading...
                </h1>


                <span class="walk-in-badge">

                    <i class="bi bi-person-walking"></i>

                    Walk-In

                </span>

            </div>


            <div class="queue-number-section">

                <p>
                    Your Queue Number
                </p>


                <div
                    id="queueNumber"
                    class="queue-number"
                >
                    ---
                </div>

            </div>


            <div class="ticket-info">


                <!-- Issued Time -->

                <div class="info-row">

                    <span class="info-label">

                        <i class="bi bi-clock"></i>

                        Issued Time

                    </span>


                    <strong id="issuedTime">
                        --
                    </strong>

                </div>

            </div>


            <div class="qr-section">

                <div
                    id="qrCode"
                    class="qr-code"
                ></div>


                <p class="qr-title">
                    Scan to track your queue
                </p>


                <p class="qr-description">

                    Use your phone to check
                    your queue status.

                </p>

            </div>


            <div class="waiting-message">

                <i class="bi bi-info-circle"></i>


                <p>

                    Please keep this ticket
                    and wait for your queue
                    number to be called.

                </p>

            </div>


            <div class="ticket-footer">

                <p>
                    Thank you for visiting The Care.
                </p>

            </div>

        </div>

    </main>

    <script src="../js/ticket.js"></script>

</body>

</html>
