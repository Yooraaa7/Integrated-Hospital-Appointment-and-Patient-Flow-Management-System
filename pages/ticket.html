<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Care | Queue Ticket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/ticket.css">
</head>

<body>

    <main class="ticket-wrapper">

        <section class="ticket-card">

            <div class="text-center">

                <img
                    src="../assets/logo.png"
                    alt="The Care Logo"
                    class="ticket-logo"
                >

                <h1>The Care</h1>

                <p class="ticket-subtitle">
                    Cardiology Department
                </p>

            </div>

            <div class="ticket-divider"></div>

            <div class="text-center">

                <p class="queue-label">
                    YOUR QUEUE NUMBER
                </p>

                <div class="queue-number">
                    CD008
                </div>

                <span class="walkin-label">
                    Walk-In
                </span>

            </div>

            <div class="ticket-divider"></div>

            <div class="ticket-details">

                <div>
                    <span>Department</span>
                    <strong>Cardiology</strong>
                </div>

                <div>
                    <span>Patients Ahead</span>
                    <strong>4</strong>
                </div>

                <div>
                    <span>Issued Time</span>
                    <strong>10:42 AM</strong>
                </div>

            </div>

            <div class="ticket-note">

                <i class="bi bi-volume-up-fill"></i>

                <p>
                    Please wait for your queue number to be called.
                </p>

            </div>

            <p class="ticket-footer">
                Thank you for visiting The Care.
            </p>

        </section>

    </main>

</body>

</html>
