<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Care | QMS Staff Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Geneva, sans-serif;

            background-image: url("../assets/background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo img {
            width: 200px;
            height: auto;
        }

        .hospital-name {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #1976d2;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.1);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;

            margin-bottom: 20px;

            font-size: 14px;
            color: #555;
        }

        .login-button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 6px;

            background-color: #1976d2;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            background-color: #125ca8;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;

            color: #5e5e5e;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- The Care Logo -->
            <div class="logo">
                <img src="../assets/logo.png" alt="The Care Hospital Logo">
            </div>

            <h1>Queue Management System</h1><br><br>

            <form>

                <div class="form-group">
                    <label for="staffID">Staff ID</label>

                    <input
                        type="text"
                        id="staffID"
                        name="staffID"
                        placeholder="Enter your Staff ID"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>

                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

        </div>

        <p class="footer-text">
            © 2026 The Care<br>
            Queue Management System
        </p>

    </div>

</body>

</html>
