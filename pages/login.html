<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Care | QMS Staff Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/login.css"
    >
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <img
                    src="../assets/logo.png"
                    alt="The Care Hospital Logo"
                >
            </div>

            <h1>Queue Management System</h1>

            <p class="subtitle">
                Staff Login
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select
                        id="department"
                        name="department"
                        required
                    >

                        <option
                            value=""
                            selected
                            disabled
                        >
                            Select Department
                        </option>

                        <option value="General Medicine">
                            General Medicine
                        </option>

                        <option value="Cardiology">
                            Cardiology
                        </option>

                        <option value="Orthopaedics">
                            Orthopaedics
                        </option>

                        <option value="Dermatology">
                            Dermatology
                        </option>

                        <option value="Paediatrics">
                            Paediatrics
                        </option>

                        <option value="Ophthalmology">
                            Ophthalmology
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="counter">
                        Counter Number
                    </label>

                    <select
                        id="counter"
                        name="counter"
                        disabled
                        required
                    >

                        <option
                            value=""
                            selected
                            disabled
                        >
                            Select Counter
                        </option>

                        <option value="Counter 1">
                            Counter 1
                        </option>

                        <option value="Counter 2">
                            Counter 2
                        </option>

                        <option value="Counter 3">
                            Counter 3
                        </option>

                        <option value="Counter 4">
                            Counter 4
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="staffID">
                        Staff ID
                    </label>

                    <input
                        type="text"
                        id="staffID"
                        name="staffID"
                        placeholder="Enter your Staff ID"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <p
                    id="loginError"
                    class="login-error"
                ></p>

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

        </div>

        <p class="footer-text">
            © 2026 The Care<br>
            Queue Management System
        </p>

    </div>

    <script src="../js/qms.js"></script>
    <script src="../js/login.js"></script>

</body>

</html>
