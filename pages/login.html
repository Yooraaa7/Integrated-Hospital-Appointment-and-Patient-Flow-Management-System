<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Care | QMS Staff Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">

            <div class="logo">
                <img src="../assets/logo.png" alt="The Care Hospital Logo">
            </div>

            <h1>Queue Management System</h1>

            <form>

                <!-- Department -->
                <div class="form-group">
                    <label for="department">Department</label>

                    <select id="department" name="department" required>
                        <option value="" disabled selected>Select Department</option>
                        <option value="general-medicine">General Medicine</option>
                        <option value="cardiology">Cardiology</option>
                        <option value="orthopaedics">Orthopaedics</option>
                        <option value="dermatology">Dermatology</option>
                        <option value="paediatrics">Paediatrics</option>
                        <option value="ophthalmology">Ophthalmology</option>
                    </select>
                </div>

                <!-- Counter -->
                <div class="form-group">
                    <label for="counter">Counter Number</label>

                    <select id="counter" name="counter" disabled required>
                        <option value="" disabled selected>Select Counter</option>
                        <option value="1">Counter 1</option>
                        <option value="2">Counter 2</option>
                        <option value="3">Counter 3</option>
                        <option value="4">Counter 4</option>
                    </select>
                </div>


                <!-- Staff ID -->
                <div class="form-group">
                    <label for="staffID">Staff ID</label>

                    <input
                        type="text"
                        id="staffID"
                        name="staffID"
                        placeholder="Enter your Staff ID"
                        required
                    >
                </div>


                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <!-- Remember Me -->
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>


                <!-- Login -->
                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

        </div>

        <p class="footer-text">
            © 2026 The Care<br>
            Queue Management System
        </p>
    </div>

    <script>
        const department = document.getElementById("department");
        const counter = document.getElementById("counter");

        department.addEventListener("change", function () {
            if (department.value !== "") {
                counter.disabled = false;
            } else {
                counter.disabled = true;
            }
        });
    </script>

</body>
</html>
