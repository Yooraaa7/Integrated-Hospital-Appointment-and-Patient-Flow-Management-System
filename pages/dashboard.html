<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Care | QMS Staff Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >
</head>

<body>

<header class="top-navbar">

    <div class="navbar-logo">
        <img
            src="../assets/logo.png"
            alt="The Care Logo"
        >
    </div>

    <div class="search-controls">

        <input
            type="text"
            id="searchInput"
            class="form-control search-input"
            placeholder="Search queue number..."
        >

        <select
            id="counterFilter"
            class="form-select filter-select"
        >
            <option value="ALL">
                All Counters
            </option>

            <option value="Counter 1">
                Counter 1
            </option>

            <option value="Counter 2">
                Counter 2
            </option>

            <option value="Counter 3">
                Counter 3
            </option>

            <option value="Counter 4">
                Counter 4
            </option>
        </select>

        <select
            id="timeFilter"
            class="form-select filter-select"
        >
            <option value="24H">
                Last 24 hours
            </option>

            <option value="30M">
                Last 30 min
            </option>

            <option value="1H">
                Last 1 hour
            </option>

            <option value="3H">
                Last 3 hours
            </option>

            <option value="ALL">
                All time
            </option>
        </select>

        <button
            type="button"
            id="searchButton"
            class="btn btn-primary search-btn"
        >
            <i class="bi bi-search"></i>
            Search
        </button>

    </div>

    <div class="staff-info">

        <span>
            <i class="bi bi-person-badge"></i>
            <span id="dashboardStaffID">
                STA101
            </span>
        </span>

        <button
            type="button"
            id="logoutButton"
            class="btn btn-danger logout-btn"
        >
            <i class="bi bi-box-arrow-right"></i>
            Log out
        </button>

    </div>

</header>


<main class="dashboard-wrapper">

    <section class="dashboard-card">

        <section class="left-panel">

            <div class="location-row">

                <span class="location-pill">
                    <i class="bi bi-geo-alt-fill"></i>
                    <span id="dashboardDepartment">
                        Cardiology
                    </span>
                </span>

                <i class="bi bi-chevron-right location-arrow"></i>

                <span class="location-pill">
                    <i class="bi bi-display"></i>
                    <span id="dashboardCounter">
                        Counter 2
                    </span>
                </span>

            </div>


            <h2 class="current-title">
                CURRENT NUMBER
            </h2>


            <div
                id="currentNumber"
                class="current-number-box"
            >
                —
            </div>


            <p
                id="currentType"
                class="current-type"
            >
                No queue is currently being served.
            </p>


            <div
                id="servingStatus"
                class="serving-status"
            >
                <span class="status-dot idle"></span>
                <i class="bi bi-check-circle"></i>
                Ready for next patient
            </div>


            <div class="action-row">

                <div class="action-group">

                    <button
                        type="button"
                        id="recallButton"
                        class="action-button recall-btn"
                        disabled
                    >
                        <i class="bi bi-arrow-repeat"></i>
                        Recall
                    </button>

                    <small>
                        Call again
                    </small>

                </div>


                <div class="action-group">

                    <button
                        type="button"
                        id="completeButton"
                        class="action-button complete-btn"
                        disabled
                    >
                        <i class="bi bi-check2-all"></i>
                        Complete & Next
                    </button>

                    <small>
                        Complete current
                    </small>

                </div>


                <div class="action-group">

                    <button
                        type="button"
                        id="holdButton"
                        class="action-button hold-btn"
                        disabled
                    >
                        <i class="bi bi-pause-circle"></i>
                        Hold & Next
                    </button>

                    <small>
                        Hold current
                    </small>

                </div>

            </div>


            <p
                id="dashboardMessage"
                class="dashboard-message"
            ></p>

        </section>


        <aside class="right-panel">

            <div class="queue-heading">

                <h2>LIST</h2>

                <div class="queue-tabs">

                    <button
                        type="button"
                        id="waitTab"
                        class="queue-tab active"
                    >
                        WAIT
                        <span id="waitCount">
                            0
                        </span>
                    </button>

                    <button
                        type="button"
                        id="holdTab"
                        class="queue-tab"
                    >
                        HOLD
                        <span id="holdCount">
                            0
                        </span>
                    </button>

                </div>

            </div>


            <select
                id="serviceFilter"
                class="form-select service-filter"
            >
                <option value="ALL">
                    All Services
                </option>

                <option value="Appointment">
                    Appointment
                </option>

                <option value="Walk-In">
                    Walk-In
                </option>
            </select>


            <div
                id="queueList"
                class="queue-list"
            ></div>

        </aside>

    </section>

</main>


<script src="../js/qms.js"></script>
<script src="../js/dashboard.js"></script>

</body>

</html>
