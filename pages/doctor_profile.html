<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile | The Care Hospital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body data-page="doctors" data-root="../">
    <div id="nav"></div>

    <section class="page-header">
        <div class="main-container">
            <div class="breadcrumb">
                <a href="../index.html">Home</a>
                <span>›</span>
                <a href="doctors.html">Find a Doctor</a>
                <span>›</span>
                <span>Doctor Profile</span>
            </div>

            <h1 class="page-title">Doctor Profile</h1>
        </div>
    </section>

    <main class="main-container">
        <section class="card profile-hero">
            <div class="profile-avatar">
                <div class="avatar-circle" id="profileInitials">DR</div>
            </div>

            <div class="profile-info">
                <span id="profileSpecialty" class="status-badge status-info"></span>
                <h2 id="profileDoctorName"></h2>
                <p id="profilePosition" class="body-text"></p>

                <div class="detail-grid">
                    <div>
                        <span class="muted-text">EXPERIENCE</span>
                        <b id="profileExperience"></b>
                    </div>

                    <div>
                        <span class="muted-text">LANGUAGES</span>
                        <b id="profileLanguages"></b>
                    </div>

                    <div>
                        <span class="muted-text">QUALIFICATIONS</span>
                        <b id="profileQualifications"></b>
                    </div>
                </div>

                <div class="doctor-actions">
                    <a id="profileBook" class="btn btn-primary">
                        <i class="bi bi-calendar-plus"></i>
                        Start Appointment
                    </a>

                    <a class="btn btn-outline" href="doctors.html">
                        Back to Doctors
                    </a>
                </div>
            </div>
        </section>

        <section class="grid-2" style="margin-top:20px">
            <div class="stack">
                <article class="card card-pad">
                    <h2 class="section-title">About the Doctor</h2>
                    <p id="profileAbout" class="body-text"></p>
                </article>

                <article class="card card-pad">
                    <h2 class="section-title">Areas of Expertise</h2>
                    <div id="profileInterests" class="chips" style="margin-top:15px"></div>
                </article>
            </div>

            <aside class="card card-pad">
                <h2 class="section-title">Doctor Availability</h2>
                <p class="muted-text">Regular weekly consultation schedule.</p>
                <div id="profileSchedule"></div>
            </aside>
        </section>
    </main>

    <div id="foot"></div>
    <script src="../js/app.js"></script>
</body>
</html>
