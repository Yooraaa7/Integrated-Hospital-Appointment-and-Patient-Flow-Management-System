<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Profile | The Care Hospital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body data-page="" data-root="../">
    <div id="nav"></div>

    <section class="page-header">
        <div class="main-container">
            <h1 class="page-title">Patient Profile</h1>
            <p class="page-description">View your patient account information.</p>
        </div>
    </section>

    <main class="main-container">
        <section class="card card-pad">

            <div class="profile-summary">
                <div class="profile-summary-icon">
                    <i class="bi bi-person"></i>
                </div>

                <div>
                    <h2 class="page-title" id="patientProfileName"></h2>
                    <p class="muted-text">Patient Account</p>
                </div>
            </div>

            <div class="profile-data">
                <div class="profile-data-item">
                    <span>Patient ID</span>
                    <strong id="patientProfileId">—</strong>
                </div>

                <div class="profile-data-item">
                    <span>Email Address</span>
                    <strong id="patientProfileEmail">—</strong>
                </div>

                <div class="profile-data-item">
                    <span>IC Number</span>
                    <strong id="patientProfileIC">—</strong>
                </div>

                <div class="profile-data-item">
                    <span>Date of Birth</span>
                    <strong id="patientProfileDOB">—</strong>
                </div>
            </div>

            <div style="margin-top: 24px;">
                <button type="button" class="btn btn-primary" id="editProfileBtn">
                    <i class="bi bi-pencil"></i> Edit Profile
                </button>
            </div>

            <form id="profileEditForm" hidden style="margin-top: 24px;">

                <h3>Edit Patient Profile</h3>

                <div class="form-group">
                    <label for="editProfileName">Full Name</label>
                    <input
                        type="text"
                        id="editProfileName"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="editProfileEmail">Email Address (Optional)</label>
                    <input
                        type="email"
                        id="editProfileEmail"
                        placeholder="Enter your email address"
                    >
                </div>

                <div class="form-group">
                    <label for="editProfileIC">IC Number (Optional)</label>
                    <input
                        type="text"
                        id="editProfileIC"
                        maxlength="12"
                        inputmode="numeric"
                        placeholder="Enter your 12-digit IC number"
                    >
                </div>

                <div class="form-group">
                    <label for="editProfileDOB">Date of Birth</label>
                    <input
                        type="date"
                        id="editProfileDOB"
                    >
                </div>

                <p class="muted-text">
                    At least one login identifier (email address or IC number) is required.
                </p>

                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>

                    <button type="button" class="btn btn-secondary" id="cancelEditProfileBtn">
                        Cancel
                    </button>
                </div>

            </form>

        </section>
    </main>


    <div id="foot"></div>
    <script src="../js/app.js"></script>
</body>
</html>
