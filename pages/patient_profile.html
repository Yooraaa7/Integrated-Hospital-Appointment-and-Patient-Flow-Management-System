<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Profile | The Care Hospital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body data-page="" data-root="../">
    <div id="nav"></div>

    <section class="page-header">
        <div class="main-container">
            <h1 class="page-title">Patient Profile</h1>
            <p class="page-description">View the account information saved in this frontend prototype.</p>
        </div>
    </section>

    <main class="main-container">
        <section class="card card-pad">

            <div class="profile-summary">
                <div class="profile-summary-icon">
                    <i class="bi bi-person"></i>
                </div>

                <div>
                    <h2 class="page-title" id="patientProfileName"></h2>
                    <p class="muted-text">Patient Account</p>
                </div>
            </div>

            <div class="profile-data">
                <div class="profile-data-item">
                    <span>Patient ID</span>
                    <strong id="patientProfileId">—</strong>
                </div>

                <div class="profile-data-item">
                    <span>Login Type</span>
                    <strong id="patientProfileIdentifierType">—</strong>
                </div>

                <div class="profile-data-item">
                    <span>Email / IC</span>
                    <strong id="patientProfileIdentifier">—</strong>
                </div>

                <div class="profile-data-item">
                    <span>Date of Birth</span>
                    <strong id="patientProfileDOB">—</strong>
                </div>
            </div>

            <div class="notice" style="margin-top:20px">
                This is still the pre-database frontend version.
                After PostgreSQL integration, patient information will come from the patients table.
            </div>
        </section>
    </main>

    <div id="foot"></div>
    <script src="../js/app.js"></script>
</body>
</html>
