<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | The Care Hospital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body data-page="appointments" data-root="../">
    <div id="nav"></div>

    <section class="page-header">
        <div class="main-container">
            <h1 class="page-title" id="appointmentPageTitle">Book Appointment</h1>
            <p class="page-description">Choose a doctor, date and available time slot.</p>
        </div>
    </section>

    <main class="main-container">
        <div class="grid-2">
            <section class="card card-pad">
                <form id="appointmentForm">

                    <div class="form-group">
                        <label for="appointmentSpecialty">Specialty</label>
                        <select id="appointmentSpecialty" class="form-select" required></select>
                    </div>

                    <div class="form-group">
                        <label for="appointmentDoctor">Doctor</label>
                        <select id="appointmentDoctor" class="form-select" required></select>
                    </div>

                    <div class="form-group">
                        <label for="appointmentDate">Appointment Date</label>
                        <input id="appointmentDate" type="date" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Available Time</label>
                        <div id="appointmentSlots" class="slot-grid">
                            <span class="muted-text">Choose a doctor and date.</span>
                        </div>
                        <input id="appointmentTime" type="hidden" required>
                    </div>

                    <div class="form-group">
                        <label for="appointmentNotes">Reason / Notes</label>
                        <textarea id="appointmentNotes" class="form-control" placeholder="Optional notes"></textarea>
                    </div>

                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-check-circle"></i>
                        <span id="appointmentSubmitText">Confirm Appointment</span>
                    </button>
                </form>
            </section>

            <aside class="card card-pad">
                <h2 class="section-title">Booking Summary</h2>

                <div id="appointmentSummary" class="body-text" style="margin-top:15px">
                    Select your appointment details to see a summary.
                </div>

                <div class="notice">
                    <i class="bi bi-info-circle"></i>
                    Today can be booked when future time slots remain available.
                    A 15-minute same-day booking buffer is applied.
                </div>
            </aside>
        </div>
    </main>

    <div id="foot"></div>
    <script src="../js/app.js"></script>
</body>
</html>
