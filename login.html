<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login | The Care Hospital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style/style.css">
</head>
<body data-page="login" data-root="">
    <div id="nav"></div>

    <main class="auth-shell">
        <section class="card auth-card">

            <a href="index.html" class="auth-back-card">
                <i class="bi bi-arrow-left"></i>
                Back to Home
            </a>

            <div class="auth-logo-container">
                <img src="assets/logo.png" alt="The Care Hospital Logo" class="auth-logo">
            </div>

            <div class="auth-heading">
                <h1 class="page-title">Patient Login</h1>
                <p class="body-text">Sign in to manage your appointments and healthcare services.</p>
            </div>

            <div id="loginMessage"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginIdentifier">Email or IC Number</label>

                    <div class="input-icon-wrapper">
                        <i class="bi bi-person input-icon"></i>

                        <input
                            class="form-control input-with-icon"
                            id="loginIdentifier"
                            type="text"
                            placeholder="Email address or IC number"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <div class="password-field">
                        <i class="bi bi-lock input-icon"></i>

                        <input
                            class="form-control input-with-icon"
                            id="loginPassword"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('loginPassword', this)"
                            aria-label="Show or hide password"
                        >
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button class="btn btn-primary auth-submit" type="submit">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Login
                </button>
            </form>

            <div class="auth-divider"><span>OR</span></div>

            <p class="auth-switch-text">Don't have a patient account?</p>

            <a class="btn btn-outline auth-submit" href="signup.html">
                <i class="bi bi-person-plus"></i>
                Create Account
            </a>
        </section>
    </main>

    <div id="foot"></div>
    <script src="js/app.js"></script>
</body>
</html>
